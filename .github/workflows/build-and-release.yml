name: Build, Test, and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test src/FcmsPro.Tests --no-build -c Release --logger "console;verbosity=normal"

  build-windows:
    name: Package - Windows
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Stamp version from tag
        shell: bash
        run: bash .github/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/FcmsPro.Avalonia/FcmsPro.Avalonia.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o installers/windows/publish
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: '"C:\Program Files (x86)\Inno Setup 6\iscc.exe" installers\windows\fcmspro.iss'
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/windows/Output/*.exe
          if-no-files-found: error

  build-macos:
    name: Package - macOS
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Stamp version from tag
        run: bash .github/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build .app and .dmg (Apple Silicon)
        run: |
          chmod +x installers/macos/build-dmg.sh
          ./installers/macos/build-dmg.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: installers/macos/build/*.dmg
          if-no-files-found: error

  build-linux:
    name: Package - Linux
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Stamp version from tag
        run: bash .github/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build .deb package
        run: |
          chmod +x installers/linux/build-deb.sh
          ./installers/linux/build-deb.sh
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O installers/linux/appimagetool-x86_64.AppImage
          chmod +x installers/linux/appimagetool-x86_64.AppImage
      - name: Build AppImage
        run: |
          chmod +x installers/linux/build-appimage.sh
          ./installers/linux/build-appimage.sh
      # Stage both files flat. Uploading two different folders keeps their
      # sub-folder (build/), which made the old "linux-packages/*" release glob
      # miss the AppImage.
      - name: Stage Linux packages
        run: |
          mkdir -p out
          cp installers/linux/*.deb out/
          cp installers/linux/build/*.AppImage out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it needs CHANGELOG.md and scripts/, and it cleans the
      # workspace, so it must run before the artifacts are downloaded into dist/.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lR dist

      # CHANGELOG.md is the single source of truth for release notes. The same
      # text ends up in the GitHub Release, appcast.xml (in-app update dialog)
      # and the website. Missing section = warning + GitHub's generated notes.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -u
          rc=0
          python3 scripts/extract-changelog.py "${GITHUB_REF_NAME#v}" --out release-notes.md || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            # Exit 3 = section missing/empty. Anything else = the script itself could not
            # run (e.g. the tag was created before scripts/ was merged to main).
            if [ "$rc" -eq 3 ]; then
              echo "::warning::No '## [${GITHUB_REF_NAME#v}]' section in CHANGELOG.md - falling back to GitHub-generated release notes."
            else
              echo "::warning::scripts/extract-changelog.py failed (exit $rc) for ${GITHUB_REF_NAME} - falling back to GitHub-generated release notes."
            fi
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # sha256sum format ("<hash>  <file>"), bare file names, so the site and
      # users can run `sha256sum -c`. Compensates for the lack of code signing.
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          for ext in exe dmg deb AppImage; do
            files=(*."$ext")
            [ "${#files[@]}" -ge 1 ] || { echo "::error::No .$ext installer in dist/"; exit 1; }
          done
          sha256sum *.exe *.dmg *.deb *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create release with all platform installers attached
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt

  # Separate job that checks out `main` directly. The old step ran inside a
  # tag checkout (detached, shallow, tag-only refspec), where `git checkout main`
  # can fail - and a failed/skipped commit leaves appcast.xml stale.
  appcast:
    name: Update appcast.xml
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate appcast for this tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: python .github/generate_appcast.py
      - name: Commit appcast to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/appcast.xml; then echo "appcast unchanged"; exit 0; fi
          git add docs/appcast.xml
          git commit -m "chore: update appcast.xml for ${GITHUB_REF_NAME} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push appcast"; exit 1
