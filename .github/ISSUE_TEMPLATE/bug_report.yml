name: Bug report
description: Something isn't working right
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Found in Settings → About, or the installer filename you downloaded
      placeholder: "1.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click/type, in order, to make this happen?
      placeholder: |
        1. Go to...
        2. Click...
        3. See error
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if you have any - these help a lot.
    validations:
      required: false
